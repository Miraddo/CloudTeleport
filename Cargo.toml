[package]
name = "cloudteleport"
version = "0.1.0"
edition = "2021"
description = "Forward files from Google Drive to Telegram chats, channels and groups — with a desktop UI and a system tray icon."
license = "MIT"
repository = "https://github.com/Miraddo/CloudTeleport"
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
tray-icon = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
auto-launch = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Same winit as eframe; used to select the X11 backend.
winit = { version = "0.30", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Debian package, built with `cargo deb` (see .github/workflows/release.yml).
[package.metadata.deb]
maintainer = "Miraddo"
copyright = "CloudTeleport contributors"
section = "net"
priority = "optional"
extended-description = "Desktop app that forwards files from Google Drive folders to Telegram channels, groups and chats, running in the background with a system tray icon."
# libayatana-appindicator is loaded at runtime, so it is not detected automatically.
depends = "$auto, libayatana-appindicator3-1"
assets = [
    ["target/release/cloudteleport", "usr/bin/", "755"],
    ["packaging/linux/cloudteleport.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/cloudteleport.png", "644"],
    ["README.md", "usr/share/doc/cloudteleport/README.md", "644"],
]
