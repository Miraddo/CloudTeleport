[package]
name = "cloudteleport"
version = "0.1.0"
edition = "2021"
description = "Forward files from Google Drive to Telegram chats, channels and groups — with a desktop UI and a system tray icon."
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
tray-icon = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
auto-launch = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# `cargo install cargo-bundle && cargo bundle --release` builds a .app / .deb / .msi.
[package.metadata.bundle]
name = "CloudTeleport"
identifier = "dev.cloudteleport.CloudTeleport"
category = "public.app-category.productivity"
short_description = "Forward Google Drive files to Telegram"
