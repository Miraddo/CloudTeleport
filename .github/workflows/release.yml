name: Release

# Push a tag like `v0.1.0` to build installers for every platform and publish a
# GitHub release. Run it manually (Actions → Release → Run workflow) to only
# build the packages and download them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Determine version
        shell: bash
        run: |
          crate_version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$crate_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary runs on older glibc versions.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: Build
        run: cargo build --release --locked
      - name: Package tarball
        run: |
          name="cloudteleport-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/cloudteleport README.md "dist/$name/"
          cp packaging/linux/cloudteleport.desktop assets/icon.png "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Package .deb
        run: |
          cargo deb --no-build --output "dist/cloudteleport_${VERSION}_${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  windows:
    needs: version
    name: Windows (x86_64)
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "cloudteleport-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/cloudteleport.exe, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item target/release/cloudteleport.exe "dist/CloudTeleport-$env:VERSION-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  macos:
    needs: version
    name: macOS (universal)
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Create CloudTeleport.app
        run: |
          app=dist/CloudTeleport.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/cloudteleport \
            target/x86_64-apple-darwin/release/cloudteleport \
            -output "$app/Contents/MacOS/cloudteleport"
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"

          iconset=$(mktemp -d)/AppIcon.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            if [ $double -le 512 ]; then
              sips -z $double $double assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"

          # Ad-hoc signature: required for Apple Silicon; not notarized.
          codesign --force --deep --sign - "$app"
      - name: Package .dmg and .zip
        run: |
          staging=$(mktemp -d)
          cp -R dist/CloudTeleport.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname CloudTeleport -srcfolder "$staging" -ov -format UDZO \
            "dist/CloudTeleport-${VERSION}-macos-universal.dmg"
          ditto -c -k --keepParent dist/CloudTeleport.app "dist/CloudTeleport-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: CloudTeleport ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
